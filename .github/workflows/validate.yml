name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'continuous' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    name: Plan and evaluate
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      hosts: ${{ steps.plan.outputs.hosts }}
      expected: ${{ steps.plan.outputs.expected }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
            http-connections = 10
            substituters = https://cache.nixos.org https://hyprland.cachix.org https://nix-community.cachix.org https://ghostty.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ghostty.cachix.org-1:QB389yTa6gTyneehvqG58y0WnHjQOqgnA+wBnpWWxns=
      - name: Check registry and selector contracts
        run: |
          nix eval --json --file checks/registry.nix > ci-registry.json
          python3 .github/scripts/test_ci.py ci-registry.json
      - name: Select validation from pinned commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci.py plan
      - name: Evaluate every exported configuration and check
        run: nix flake check --no-build

  source-unit:
    name: Source unit contracts
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.expected)['source-unit'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
            http-connections = 10
            substituters = https://cache.nixos.org https://hyprland.cachix.org https://nix-community.cachix.org https://ghostty.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ghostty.cachix.org-1:QB389yTa6gTyneehvqG58y0WnHjQOqgnA+wBnpWWxns=
      - name: Restore compatible Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-unit-${{ hashFiles('flake.lock') }}-${{ needs.plan.outputs.tree }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-unit-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-unit-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 5G
      - uses: actions/setup-python@v5
        if: ${{ contains(fromJSON(needs.plan.outputs.plan).support, 'codex-clef') }}
        with:
          python-version: '3.13'
      - name: Install Clef test dependencies
        if: ${{ contains(fromJSON(needs.plan.outputs.plan).support, 'codex-clef') }}
        run: python -m pip install jsonschema pillow tomli-w
      - name: Clef offline decisions, privacy, hooks and migrations
        if: ${{ contains(fromJSON(needs.plan.outputs.plan).support, 'codex-clef') }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python checks/codex-clef-test.py modules/home/codex checks/fixtures/codex-0.162.0
      - name: Build selected lightweight unit checks
        if: ${{ !cancelled() && needs.plan.result == 'success' && toJSON(fromJSON(needs.plan.outputs.plan).units) != '[]' }}
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 .github/scripts/ci.py build-units

  support-check:
    name: Grouped support checks
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.expected)['support-check'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
            http-connections = 10
            substituters = https://cache.nixos.org https://hyprland.cachix.org https://nix-community.cachix.org https://ghostty.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ghostty.cachix.org-1:QB389yTa6gTyneehvqG58y0WnHjQOqgnA+wBnpWWxns=
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force || true
          df -h
      - name: Restore compatible Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-support-${{ hashFiles('flake.lock') }}-${{ needs.plan.outputs.tree }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-support-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-support-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 5G
      - name: Build every selected support check and retain failures
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 .github/scripts/ci.py build-support

  host-check:
    name: Validate ${{ matrix.host }} and integrations
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.expected)['host-check'] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
            http-connections = 10
            substituters = https://cache.nixos.org https://hyprland.cachix.org https://nix-community.cachix.org https://ghostty.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ghostty.cachix.org-1:QB389yTa6gTyneehvqG58y0WnHjQOqgnA+wBnpWWxns=
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force || true
          df -h
      - name: Restore compatible Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-host-${{ matrix.host }}-${{ hashFiles('flake.lock') }}-${{ needs.plan.outputs.tree }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-host-${{ matrix.host }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-host-${{ matrix.host }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 5G
      - name: Build host and its integrations in one store
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_HOST: ${{ matrix.host }}
        run: python3 .github/scripts/ci.py build-host

  result:
    name: Validate result
    needs: [plan, source-unit, support-check, host-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every selected lane to succeed
        env:
          EXPECTED_JOBS: ${{ needs.plan.outputs.expected }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci.py gate
